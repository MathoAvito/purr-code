# PC-407 — user-facing PRs must include a Changeset.
name: Changeset

on:
  pull_request:

permissions:
  contents: read

jobs:
  require-changeset:
    name: require-changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for changeset when publish surface changes
        shell: bash
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/ci/check-changeset.sh
