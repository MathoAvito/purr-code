# CI matrix (PC-008). Security posture per PRD §23.3:
# - fork PRs run on the plain `pull_request` trigger only (never pull_request_target)
# - zero secrets available to PR workflows; least-privilege permissions
# - every action pinned to an immutable commit SHA
#
# Sidecar builds (PC-301): native compile per OS, checksummed artifacts, no postinstall.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
        if: matrix.os != 'ubuntu-latest'

      # Coverage variant on one OS only; report lands in the job log.
      - run: pnpm test:coverage
        if: matrix.os == 'ubuntu-latest'

      - run: pnpm e2e:fake-audio
        env:
          PURRCODE_FAKE_AUDIO: "1"

      # PC-401: assemble plugin tree + structural validate (claude CLI may be absent → skip that step)
      - run: pnpm plugin:build

  sidecar:
    name: sidecar-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            os: linux
            arch: x64
          - target: darwin-arm64
            runner: macos-latest
            os: darwin
            arch: arm64
          - target: darwin-x64
            runner: macos-latest
            os: darwin
            arch: x64
          - target: win32-x64
            runner: windows-latest
            os: win32
            arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch vendored headers
        shell: bash
        run: bash packages/sidecar/scripts/fetch-vendor.sh

      - name: Build sidecar (Unix)
        if: matrix.os != 'win32'
        shell: bash
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash packages/sidecar/scripts/build.sh

      - name: Build sidecar (Windows)
        if: matrix.os == 'win32'
        shell: bash
        env:
          TARGET_OS: win32
          TARGET_ARCH: x64
        run: bash packages/sidecar/scripts/build.sh

      - name: Verify checksum file
        shell: bash
        run: |
          set -euo pipefail
          pkg="packages/sidecar-${{ matrix.target }}"
          test -f "$pkg/SHA256SUMS"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$pkg" && sha256sum -c SHA256SUMS)
          else
            (cd "$pkg" && shasum -a 256 -c SHA256SUMS)
          fi
          echo "Checksum OK for ${{ matrix.target }}:"
          cat "$pkg/SHA256SUMS"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: purr-sidecar-${{ matrix.target }}
          path: |
            packages/sidecar-${{ matrix.target }}/bin/**
            packages/sidecar-${{ matrix.target }}/SHA256SUMS
          if-no-files-found: error
