# Enforce §23.3 / PC-406: ban pull_request_target + fork-checkout patterns.
name: Workflow lint

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/ci/**"

permissions:
  contents: read

jobs:
  lint-workflows:
    name: no-pull-request-target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Ban pull_request_target and unpinned actions
        shell: bash
        run: bash scripts/ci/lint-workflows.sh
