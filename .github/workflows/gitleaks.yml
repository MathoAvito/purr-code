# Secret scan over the full git history on every push/PR (PRD §23.3 posture).
# Same rules as ci.yml: plain pull_request trigger, least privilege, SHA pins.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

# pull-requests:read — the action lists PR commits via the API on pull_request
# events. PR comments stay disabled so write access is never needed.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
